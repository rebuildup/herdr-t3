name: ci

on:
  pull_request:
  push:
    branches: [main, "release-*"]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.17.1
      - uses: actions/cache@v4
        with:
          path: native
          key: ghostty-vt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/ghostty-vt/build-native.sh') }}
      - run: bun install --frozen-lockfile
      - run: ./scripts/ci.sh
      - run: bun run build
