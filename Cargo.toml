[workspace]
resolver = "2"
members = [
    "crates/diff-adapter",
    "crates/herdr-bridge",
    "crates/protocol-codec",
    "crates/state-projections",
    "crates/terminal-core",
    "crates/terminal-input",
    "crates/terminal-render",
    "crates/terminal-surface",
    "crates/terminal-view",
    "crates/ui-kit",
    "crates/ui-test-host",
]

[workspace.package]
edition = "2021"
rust-version = "1.85"

# xattr 0.2.3 (via gpui -> gpui_http_client -> zed-async-tar) references
# libc::ENOATTR, removed on Linux/Android in libc >= 0.2.190
# (rust-lang/libc#1356, zed-industries/zed#67211). Vendored copy resolves
# ENOATTR to ENODATA on those targets only; remove when the gpui
# dependency chain moves to a maintained xattr (issue #634).
[patch.crates-io]
xattr = { path = "vendor/xattr" }
