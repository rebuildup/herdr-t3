[workspace]
resolver = "2"
members = [
    "crates/diff-adapter",
    "crates/protocol-codec",
    "crates/state-projections",
    "crates/terminal-core",
    "crates/terminal-input",
    "crates/terminal-render",
    "crates/ui-test-host",
]

[workspace.package]
edition = "2021"
rust-version = "1.85"
