[package]
name = "herdr-ui"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
gpui = "0.2.2"
herdr-bridge = { path = "../herdr-bridge" }
protocol-codec = { path = "../protocol-codec" }
serde_json = "1"
state-projections = { path = "../state-projections" }
terminal-core = { path = "../terminal-core" }
terminal-render = { path = "../terminal-render" }
terminal-surface = { path = "../terminal-surface" }
terminal-view = { path = "../terminal-view" }
ui-kit = { path = "../ui-kit" }

[dev-dependencies]
gpui = { version = "0.2.2", features = ["test-support"] }
