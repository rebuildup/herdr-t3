[package]
name = "protocol-codec"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Product-intended Rust codec for the herdr-t3 bridge<->client protocol (issue #275, capability protocol.codec, contract protocol-frames@1). Mirrors shared/protocol.ts: ClientFrame/ServerFrame JSON codec, isClientFrame validation, SessionSnapshot types, RPC_METHODS allow-list."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
