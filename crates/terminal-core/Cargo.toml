[package]
name = "terminal-core"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Product-intended Rust terminal core for herdr-t3 (issue #286): a faithful port of shared/ghostty/engine.ts + src/lib/ghostty/session.ts onto the native libghostty-vt C API. Runtime-agnostic — no Electron/DOM dependencies — so the same engine can later back the GPUI terminal surface."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }
