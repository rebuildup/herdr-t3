# herdr-t3 quality profile
schema_version: 1

stack:
  primary_languages:
    - typescript
    - tsx
  target_platforms:
    - macos
    - windows-11
  package_manager: bun
  ci: github-actions

gates:
  fast:
    command: './scripts/ci.sh'
    components:
      - 'tsc --noEmit typecheck'
      - 'bun test unit tests (server/, shared/)'
      - 'ADR index consistency'
    cost_class: cheap
    trigger: local feedback + every CI run

  integration:
    command: './scripts/ci.sh && bun run build'
    components:
      - fast
      - 'vite production build'
    cost_class: medium
    trigger: pull_request + push_to_main_and_release
    note: 'Real-machine herdr attach/resize verification stays manual per release candidate.'

  release:
    command: './scripts/ci.sh && bun run build'
    components:
      - integration
    cost_class: medium
    trigger: release_branch
    note: 'Release candidates additionally need side-by-side T3 design review and macOS/Windows smoke runs.'

change_risk_mapping:
  doc_only:
    gate: fast
  adr_change:
    gate: fast
  server_bridge:
    gate: integration
    note: 'Bridge protocol changes need a live herdr session check.'
  ui_change:
    gate: integration
    note: 'UI changes need visual verification against T3 reference before release.'
  ci_workflow:
    gate: integration
  release_branch:
    gate: release

ci:
  workflow: .github/workflows/ci.yml
  jobs:
    - name: check
      command: './scripts/ci.sh && bun run build'
      triggers:
        - pull_request
        - push_to_main
        - push_to_release_branch
  required_status_checks_default: []
  note: 'Do not invent a required check name merely to encode source-branch policy.'

external_verification:
  macos_windows:
    command: 'manual: launch bridge, open UI, exercise workspace/tab/pane ops against a test herdr session'
    automated_in_ci: false
    reason: 'Requires a real herdr session and display; GitHub-hosted CI has neither.'
  - name: ui-lint
    command: bun run lint:ui
